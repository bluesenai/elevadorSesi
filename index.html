<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SESI Elevador</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<body>

  <div class="alerta-topo" id="alerta">
    ⚠ ELEVADOR EM SOBRECARGA ⚠
  </div>

  <div class="container">
    
    <h1>SESI Elevador</h1>

    <div class="peso">
      Carga Atual: <span id="peso">0</span> kg
    </div>

    <div class="botoes">
      <button id="addBtn">
        Adicionar 100kg
      </button>
      <button id="removeBtn">
        Remover 100kg
      </button>
      <button id="resetBtn">
        Resetar
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
